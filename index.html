const KDF_ITER = 310000;
const LS_KEY = "keiei_dash_key_v1";

const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const b64e = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));

async function deriveKey(passphrase, saltB64) {
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey("raw", enc.encode(passphrase), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: b64d(saltB64), iterations: KDF_ITER, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
}

async function tryDecrypt(key) {
  const pt = await crypto.subtle.decrypt(
    { name: "AES-GCM", iv: b64d(PAYLOAD.nonce) }, key, b64d(PAYLOAD.ct));
  return new TextDecoder().decode(pt);
}

function render(html) {
  document.open(); document.write(html); document.close();
}

async function autoOpen() {
  try {
    const saved = JSON.parse(localStorage.getItem(LS_KEY) || "null");
    if (!saved || saved.salt !== PAYLOAD.salt) return;
    const key = await crypto.subtle.importKey("raw", b64d(saved.key), "AES-GCM", true, ["decrypt"]);
    render(await tryDecrypt(key));
  } catch (e) { /* fall through to password form */ }
}

document.getElementById("f").addEventListener("submit", async ev => {
  ev.preventDefault();
  const btn = document.getElementById("btn"), err = document.getElementById("err");
  btn.disabled = true; btn.textContent = "確認中…"; err.textContent = "";
  try {
    const key = await deriveKey(document.getElementById("pw").value, PAYLOAD.salt);
    const html = await tryDecrypt(key);
    if (document.getElementById("rm").checked) {
      const raw = await crypto.subtle.exportKey("raw", key);
      localStorage.setItem(LS_KEY, JSON.stringify({ salt: PAYLOAD.salt, key: b64e(raw) }));
    }
    render(html);
  } catch (e) {
    err.textContent = "パスワードが違います";
    btn.disabled = false; btn.textContent = "開く";
  }
});

autoOpen();
</script>
